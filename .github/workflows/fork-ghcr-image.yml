# Fork-only: publish a test image of this branch to ghcr.io/<owner>/bambuddy
# while the feature waits to be merged upstream. Not part of the upstream PR
# (that is opened from feature/combine-stl-3mf-dev, which does not carry this
# file).
#
#   ghcr.io/<owner>/bambuddy:combine          - latest build of this branch
#   ghcr.io/<owner>/bambuddy:combine-<sha7>   - pinned build
name: Fork image (ghcr)

on:
  push:
    branches: [feature/combine-stl-3mf]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-ghcr-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    # Never run in the upstream repo if this file ever travels there.
    if: github.repository_owner != 'maziggy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: img
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bambuddy" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:combine
            ${{ steps.img.outputs.name }}:combine-${{ steps.img.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Bambuddy with Combine to 3MF (fork test build)
          cache-from: type=gha
          cache-to: type=gha,mode=max
